name: Verify

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: developer_ops_test
          POSTGRES_USER: developer_ops
          POSTGRES_PASSWORD: developer_ops
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U developer_ops -d developer_ops_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check types
        run: npm run typecheck

      - name: Lint source code
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Run PostgreSQL integration tests
        env:
          TEST_DATABASE_URL: postgresql://developer_ops:developer_ops@localhost:5432/developer_ops_test
        run: npm run test:integration

      - name: Build applications
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev
