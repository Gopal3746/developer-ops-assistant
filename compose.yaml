services:
  postgres:
    image: postgres:17-alpine
    container_name: developer-ops-postgres
    environment:
      POSTGRES_DB: developer_ops
      POSTGRES_USER: developer_ops
      POSTGRES_PASSWORD: developer_ops
    ports:
      - "5432:5432"
    volumes:
      - developer_ops_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U developer_ops -d developer_ops
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  developer_ops_postgres_data:
